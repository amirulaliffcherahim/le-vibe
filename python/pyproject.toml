[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "le-vibe"
version = "0.1.0b1"
description = "Unified Python provider (Vibe + DeepSeek + Antigravity), policy, and extension runtime for le-vibe"
authors = [{ name = "Amirul Aliff" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "keyring>=25.5.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
