name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: le-vibe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: le-vibe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: le-vibe.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --no-default-features -p le-vibe-cli --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp -r python dist/python
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
