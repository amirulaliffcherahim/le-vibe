[workspace]
resolver = "2"
members = [
    "crates/lazybug-schema",
    "crates/lazybug-telemetry",
    "crates/lazybug-pybridge",
    "crates/lazybug-durable",
    "crates/lazybug-tools",
    "crates/lazybug-mcp",
    "crates/lazybug-agent",
    "crates/lazybug-tui",
    "crates/lazybug-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Amirul Aliff"]
repository = "https://github.com/amirulaliffcherahim/lazybug"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
